# /etc/systemd/system/gpu-power-limit.service.d/pl-console.conf
# 由 vLLM 控制台写入（gpu-ctl persist-pl），保持控制台功耗设置跨重启生效。
# 2026-10-03 定版：Environment=PL=210（双卡 CMP 170HX 各 210 W；
# 沿革 200→250→210→300→250→210。改功耗必须同时查本 drop-in 与
# /usr/local/bin/gpu-power-limit.sh 缺省值两处，只改脚本会被本文件静默覆盖）。
[Service]
Environment=PL=210
